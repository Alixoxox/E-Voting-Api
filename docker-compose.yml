services:
  backend:
    build: 960828422057.dkr.ecr.us-east-1.amazonaws.com/e-voting-api:latest
    container_name: evoting-api
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    container_name: evoting-redis
    ports:
      - "6379"
